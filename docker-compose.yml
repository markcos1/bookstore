services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=bookstore_db
      - POSTGRES_USER=bookstore_user
      - POSTGRES_PASSWORD=bookstore_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db
    networks:
      - backend

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=bookstore_db
      - POSTGRES_USER=bookstore_user
      - POSTGRES_PASSWORD=bookstore_pass
    ports:
      - "5432:5432"
    networks:
      - backend
volumes:
  postgres_data:

networks:
  backend:
    driver: bridge